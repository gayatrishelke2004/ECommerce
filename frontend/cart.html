<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FoodExpress - Cart</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f8f9fa;
}

/* Navbar */

nav{
    background:white;
    padding:18px 50px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#ff6b35;
}

nav ul{
    display:flex;
    list-style:none;
    gap:30px;
}

nav ul li a{
    text-decoration:none;
    color:#333;
    font-weight:600;
}

nav ul li a:hover{
    color:#ff6b35;
}

/* Main Container */

.container{
    width:90%;
    margin:auto;
    padding:40px 0;
}

.page-title{
    margin-bottom:25px;
    color:#333;
}

/* Cart Layout */

.cart-wrapper{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:25px;
}

/* Cart Items */

.cart-items{
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0px 3px 12px rgba(0,0,0,.1);
}

.cart-item{
    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid #eee;
    padding:20px 0;
}

.cart-item img{
    width:120px;
    height:90px;
    object-fit:cover;
    border-radius:10px;
}

.item-info{
    flex:1;
    margin-left:20px;
}

.item-info h3{
    color:#333;
    margin-bottom:5px;
}

.item-info p{
    color:gray;
}

.quantity{
    display:flex;
    align-items:center;
    gap:10px;
}

.quantity button{
    width:35px;
    height:35px;
    border:none;
    background:#ff6b35;
    color:white;
    font-size:20px;
    border-radius:50%;
    cursor:pointer;
}

.price{
    font-size:18px;
    font-weight:bold;
    color:#ff6b35;
}

/* Billing Section */

.bill{
    background:white;
    border-radius:15px;
    padding:25px;
    height:fit-content;
    box-shadow:0px 3px 12px rgba(0,0,0,.1);
}

.bill h2{
    margin-bottom:20px;
}

.bill-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
}

.total{
    font-size:22px;
    font-weight:bold;
    color:#ff6b35;
}

.checkout-btn{
    width:100%;
    margin-top:20px;
    padding:15px;
    background:#ff6b35;
    border:none;
    color:white;
    font-size:16px;
    border-radius:10px;
    cursor:pointer;
}

.checkout-btn:hover{
    background:#e95a25;
}

/* Coupon */

.coupon{
    margin-top:20px;
}

.coupon input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
}

.offer{
    background:#ffe8de;
    color:#ff6b35;
    padding:12px;
    border-radius:8px;
    margin-top:12px;
    font-weight:bold;
}

/* Responsive */

@media(max-width:768px){

    .cart-wrapper{
        grid-template-columns:1fr;
    }

    .cart-item{
        flex-direction:column;
        gap:15px;
    }
}

</style>

</head>

<body>

<!-- Navbar -->

<nav>

<div class="logo">🍔 FoodExpress</div>

<ul>
<li><a href="index.html">Home</a></li>
<li><a href="profile.html">Profile</a></li>
<li><a href="cart.html">Cart</a></li>
<li><a href="orders.html">Orders</a></li>
<li><a href="delivery.html">Delivery</a></li>
</ul>

</nav>

<!-- Cart -->

<div class="container">

<h1 class="page-title">🛒 Your Cart</h1>

<div class="cart-wrapper">

<!-- Cart Items -->

<div class="cart-items">

<div class="cart-item">

<img src="https://images.unsplash.com/photo-1513104890138-7c749659a591">

<div class="item-info">

<h3>Margherita Pizza</h3>

<p>Pizza Hut</p>

</div>

<div class="quantity">

<button>-</button>

<span>2</span>

<button>+</button>

</div>

<div class="price">₹500</div>

</div>

<div class="cart-item">

<img src="https://images.unsplash.com/photo-1550547660-d9450f859349">

<div class="item-info">

<h3>Chicken Burger</h3>

<p>Burger King</p>

</div>

<div class="quantity">

<button>-</button>

<span>1</span>

<button>+</button>

</div>

<div class="price">₹220</div>

</div>

<div class="cart-item">

<img src="https://images.unsplash.com/photo-1563379091339-03246963d51a">

<div class="item-info">

<h3>Veg Noodles</h3>

<p>Chinese Express</p>

</div>

<div class="quantity">

<button>-</button>

<span>1</span>

<button>+</button>

</div>

<div class="price">₹180</div>

</div>

</div>

<!-- Bill Summary -->

<div class="bill">

<h2>Bill Summary</h2>

<div class="bill-row">
<span>Subtotal</span>
<span>₹900</span>
</div>

<div class="bill-row">

</div>

<span>GST</span>
<span>₹51</span>
</div>

<hr>

<br>

<div class="bill-row total">
<span>Total</span>
<span>₹1000</span>
</div>

<div class="coupon">

<input
type="text"
placeholder="Enter Coupon Code">

<div class="offer">
🔥 FOOD50 - Get 50% OFF
</div>

</div>

<button class="checkout-btn">
Proceed To Checkout
</button>

</div>

</div>

</div>

</body>

</html>
